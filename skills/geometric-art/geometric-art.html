<!doctype html>
<html
  lang="en"
  data-composition-variables='[{"id":"headline1","type":"string","label":"Headline 1","default":"Geometry","maxLength":28},{"id":"headline2","type":"string","label":"Headline 2 (empty to hide)","default":"in motion","maxLength":28},{"id":"description","type":"string","label":"Description (empty to hide)","default":"Flat bands, dithered edges, one slow drift.","maxLength":120},{"id":"palette","type":"string","label":"Palette, 2 to 8 hex stops, dark to light","default":"#2F6BFF, #EEF5FF"},{"id":"bands","type":"number","label":"Bands","default":4,"min":2,"max":8,"step":1},{"id":"angle","type":"number","label":"Ramp angle (deg)","default":45,"min":0,"max":360,"step":1},{"id":"noise","type":"number","label":"Edge wander","default":0.25,"min":0,"max":0.8,"step":0.01},{"id":"noiseScale","type":"number","label":"Noise scale","default":1.5,"min":0.2,"max":6,"step":0.05},{"id":"dither","type":"number","label":"Dither spread (0 = hard edges)","default":0.5,"min":0,"max":1.5,"step":0.05},{"id":"pixel","type":"number","label":"Dither cell (px)","default":4,"min":1,"max":16,"step":1},{"id":"fade","type":"number","label":"Paper dissolve radius","default":0.35,"min":0,"max":1.5,"step":0.01},{"id":"paper","type":"color","label":"Paper","default":"#FFFFFF"},{"id":"ink","type":"color","label":"Ink","default":"#0B1220"},{"id":"font","type":"string","label":"Headline font","default":"Inter, Helvetica, Arial, sans-serif"},{"id":"fontWeight","type":"number","label":"Font weight","default":700,"min":100,"max":900,"step":100},{"id":"fontSize","type":"number","label":"Font size px (auto-fits down)","default":170,"min":60,"max":280,"step":1},{"id":"letterSpacing","type":"number","label":"Letter spacing em (ignored for Arabic)","default":-0.045,"min":-0.1,"max":0.3,"step":0.005},{"id":"speed","type":"number","label":"Drift speed","default":1,"min":0,"max":4,"step":0.05}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Geometric Art</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="assets/geometric-art.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #fff; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      #ga-art { position: absolute; inset: 0; }
      #ga-copy {
        position: absolute; inset: 0; padding: 0 160px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; color: var(--ga-ink);
      }
      .ga-mask { overflow: hidden; padding-bottom: 0.08em; }
      .ga-line {
        font-family: var(--ga-font); font-weight: var(--ga-weight); font-size: var(--ga-size);
        line-height: var(--ga-lh); letter-spacing: var(--ga-track); white-space: nowrap;
      }
      #ga-desc {
        margin-top: 56px; max-width: 820px; font-family: var(--ga-font);
        font-size: 34px; line-height: 1.45; opacity: 0.72;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="geometric-art" data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <div id="ga-art"></div>
      <div id="ga-copy">
        <div class="ga-mask"><div class="ga-line" id="ga-h1"></div></div>
        <div class="ga-mask"><div class="ga-line" id="ga-h2"></div></div>
        <p id="ga-desc"></p>
      </div>
    </div>

    <script>
      (function () {
        var ID = "geometric-art", DURATION = 8;
        var vars = {};
        try {
          if (window.__hyperframes && window.__hyperframes.getVariables) vars = window.__hyperframes.getVariables() || {};
        } catch (e) {}
        function num(id, fallback, min, max) {
          var v = vars[id] === undefined ? fallback : Number(vars[id]);
          return isFinite(v) ? Math.max(min, Math.min(max, v)) : fallback;
        }
        function str(id, fallback) { return vars[id] === undefined ? fallback : String(vars[id]); }

        var h1 = str("headline1", "Geometry"), h2 = str("headline2", "in motion"), desc = str("description", "Flat bands, dithered edges, one slow drift.");
        // Arabic joins letters: tracking breaks it and tight leading clips it in the mask
        var arabic = /[؀-ۿݐ-ݿﭐ-﷿ﹰ-﻿]/.test(h1 + h2 + desc);
        var root = document.getElementById("root"), copy = document.getElementById("ga-copy");
        if (arabic) { copy.dir = "rtl"; copy.lang = "ar"; }
        var size = num("fontSize", 170, 60, 280);
        var css = {
          "--ga-ink": str("ink", "#0B1220"),
          "--ga-font": str("font", "Inter, Helvetica, Arial, sans-serif"),
          "--ga-weight": num("fontWeight", 700, 100, 900),
          "--ga-size": size + "px",
          "--ga-lh": arabic ? 1.3 : 0.96,
          "--ga-track": arabic ? "0" : num("letterSpacing", -0.045, -0.1, 0.3) + "em",
        };
        for (var k in css) root.style.setProperty(k, css[k]);
        document.body.style.background = str("paper", "#FFFFFF");

        document.getElementById("ga-h1").textContent = h1;
        document.getElementById("ga-h2").textContent = h2;
        document.getElementById("ga-desc").textContent = desc;
        [["ga-h1", h1], ["ga-h2", h2], ["ga-desc", desc]].forEach(function (p) {
          if (!p[1].trim()) (p[0] === "ga-desc" ? document.getElementById(p[0]) : document.getElementById(p[0]).parentNode).style.display = "none";
        });

        // shrink both lines together until the widest fits 1600px
        function fit() {
          root.style.setProperty("--ga-size", size + "px");
          var w = Math.max(document.getElementById("ga-h1").scrollWidth, document.getElementById("ga-h2").scrollWidth);
          if (w > 1600) root.style.setProperty("--ga-size", Math.floor((size * 1600) / w) + "px");
        }
        fit();
        if (document.fonts) document.fonts.ready.then(fit);

        // canvas is created at runtime so Studio's variable parser never sees it
        var host = document.getElementById("ga-art");
        var canvas = document.createElement("canvas");
        canvas.width = 1920;
        canvas.height = 1080;
        canvas.style.cssText = "position:absolute;inset:0;width:100%;height:100%;display:block";
        host.appendChild(canvas);

        var FADE = num("fade", 0.35, 0, 1.5);
        var art = GeometricArt.create(canvas, {
          colors: str("palette", "#2F6BFF, #EEF5FF"),
          bands: num("bands", 4, 2, 8),
          angle: num("angle", 45, 0, 360),
          noise: num("noise", 0.25, 0, 0.8),
          scale: num("noiseScale", 1.5, 0.2, 6),
          dither: num("dither", 0.5, 0, 1.5),
          pixel: num("pixel", 4, 1, 16),
          fade: FADE,
          paper: str("paper", "#FFFFFF"),
          speed: num("speed", 1, 0, 4),
        });

        // ---- one paused timeline; the art is a pure function of (t, S.fade) ----
        var S = { fade: 3.2 };
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });
        tl.to(S, { fade: FADE, duration: 2.2, ease: "power3.out" }, 0); // bands flood in from the far corner
        tl.from(".ga-line", { yPercent: 105, opacity: 0, duration: 1.1, ease: "expo.out", stagger: 0.15 }, 0.55);
        tl.from("#ga-desc", { y: 24, opacity: 0, duration: 0.8, ease: "power2.out" }, 1.05);
        tl.set({}, {}, DURATION);

        function draw() {
          if (!art) return;
          art.set({ fade: S.fade });
          art.render(tl.time());
        }
        tl.eventCallback("onUpdate", draw);
        // Studio seeks with GSAP events suppressed and fires hf-seek instead
        window.addEventListener("hf-seek", function (e) {
          var d = e && e.detail;
          if (d && typeof d.time === "number") tl.totalTime(Math.min(d.time, tl.totalDuration()), true);
          draw();
        });
        window.__timelines[ID] = tl;

        draw();
        window.__hf = window.__hf || {};
        window.__hf.buildReady = window.__hf.buildReady || {};
        window.__hf.buildReady[ID] = Promise.resolve().then(function () { if (art) art.gl.finish(); });
      })();
    </script>
  </body>
</html>
