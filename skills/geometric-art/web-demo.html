<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Geometric Art</title>
    <script src="assets/geometric-art.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; background: #fff; color: #0b1220; }
      .ga-hero {
        position: relative; min-height: 100svh; overflow: hidden; container-type: inline-size;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 64px 16px; text-align: center;
      }
      .ga-hero > :not(canvas) { position: relative; }
      .ga-mask { display: block; overflow: hidden; padding-bottom: 0.08em; }
      .ga-line {
        display: block; font-weight: 700; line-height: 0.96; letter-spacing: -0.045em;
        font-size: clamp(3rem, 11cqi, 10rem);
        animation: ga-rise 1.1s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .ga-mask + .ga-mask .ga-line { animation-delay: 0.15s; }
      .ga-desc {
        max-width: 30rem; margin-top: 2.5rem; font-size: clamp(1.05rem, 2.2cqi, 1.35rem);
        line-height: 1.5; opacity: 0.72; animation: ga-up 0.8s 0.5s ease-out both;
      }
      @keyframes ga-rise { from { transform: translateY(105%); opacity: 0; } }
      @keyframes ga-up { from { transform: translateY(20px); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .ga-line, .ga-desc { animation: none; } }

      /* tuning panel, delete in production */
      details {
        position: fixed; right: 16px; bottom: 16px; z-index: 2; width: min(320px, calc(100vw - 32px));
        background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(8px);
        border: 1px solid rgba(11, 18, 32, 0.12); border-radius: 12px; font-size: 13px;
      }
      summary { padding: 10px 14px; cursor: pointer; font-weight: 600; }
      .rows { display: grid; gap: 8px; padding: 0 14px 14px; }
      label { display: grid; grid-template-columns: 90px 1fr 40px; align-items: center; gap: 8px; }
      label output { text-align: right; font-variant-numeric: tabular-nums; }
      input[type="text"] { width: 100%; padding: 4px 6px; font: inherit; }
      pre { white-space: pre-wrap; word-break: break-all; font-size: 11px; background: #f3f5f8; padding: 8px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <section class="ga-hero" id="hero">
      <h1>
        <span class="ga-mask"><span class="ga-line">Geometry</span></span>
        <span class="ga-mask"><span class="ga-line">in motion</span></span>
      </h1>
      <p class="ga-desc">Flat bands, dithered edges, one slow drift.</p>
    </section>

    <details>
      <summary>Tune</summary>
      <div class="rows" id="rows">
        <label>palette <input type="text" data-k="colors" value="#2F6BFF, #EEF5FF" style="grid-column: span 2" /></label>
      </div>
    </details>

    <script>
      const art = GeometricArt.mount(document.getElementById("hero"), {});
      const cfg = { ...GeometricArt.DEFAULTS, colors: "#2F6BFF, #EEF5FF" };
      delete cfg.pixelRatio;
      const ranges = { bands: [2, 8, 1], angle: [0, 360, 1], noise: [0, 0.8, 0.01], scale: [0.2, 6, 0.05], dither: [0, 1.5, 0.05], pixel: [1, 16, 1], fade: [0, 1.5, 0.01], speed: [0, 4, 0.05] };
      const rows = document.getElementById("rows");
      for (const [k, [min, max, step]] of Object.entries(ranges)) {
        rows.insertAdjacentHTML("beforeend", `<label>${k} <input type="range" data-k="${k}" min="${min}" max="${max}" step="${step}" value="${cfg[k]}" /><output>${cfg[k]}</output></label>`);
      }
      rows.insertAdjacentHTML("beforeend", `<label>paper <input type="color" data-k="paper" value="#ffffff" /></label><pre id="out"></pre>`);
      const out = document.getElementById("out");
      const show = () => (out.textContent = "GeometricArt.mount(el, " + JSON.stringify(cfg) + ")");
      rows.addEventListener("input", (e) => {
        const k = e.target.dataset.k;
        if (!k) return;
        cfg[k] = e.target.type === "range" ? Number(e.target.value) : e.target.value;
        if (e.target.nextElementSibling?.tagName === "OUTPUT") e.target.nextElementSibling.textContent = e.target.value;
        if (art) art.set({ [k]: cfg[k] });
        show();
      });
      show();
    </script>
  </body>
</html>
